<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- GitHub Logo & Brand -->
  <g transform="translate(60, 50)">
    <!-- Octocat / GitHub Mark -->
    <path fill="#ffffff" d="M30 0C13.43 0 0 13.43 0 30c0 13.26 8.6 24.51 20.53 28.48 1.5.28 2.05-.65 2.05-1.45 0-.71-.03-2.61-.04-5.12-8.35 1.81-10.11-4.02-10.11-4.02-1.37-3.47-3.34-4.4-3.34-4.4-2.73-1.86.21-1.83.21-1.83 3.01.21 4.6 3.09 4.6 3.09 2.68 4.59 7.03 3.26 8.74 2.5.27-1.94 1.05-3.26 1.91-4.01-6.66-.76-13.67-3.33-13.67-14.83 0-3.28 1.17-5.96 3.09-8.06-.31-.76-1.34-3.81.29-7.95 0 0 2.52-.81 8.26 3.08 2.4-.67 4.97-1 7.53-1.01 2.56.01 5.13.34 7.53 1.01 5.73-3.89 8.25-3.08 8.25-3.08 1.64 4.14.61 7.19.3 7.95 1.93 2.1 3.09 4.78 3.09 8.06 0 11.53-7.02 14.06-13.7 14.81 1.08.93 2.04 2.76 2.04 5.57 0 4.02-.04 7.27-.04 8.26 0 .81.54 1.75 2.07 1.45C51.42 54.49 60 43.25 60 30c0-16.57-13.43-30-30-30z"/>
    <text x="80" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">GitHub System Status</text>
    <text x="80" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">Official Live Outage Alert • githubstatus.com</text>
  </g>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(860, 55)">
    <rect width="280" height="46" rx="23" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="28" cy="23" r="7" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="28" cy="23" r="4" fill="#ffffff"/>
    <text x="48" y="29" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">MAJOR OUTAGE ACTIVE</text>
  </g>

  <!-- Main Incident Banner Card -->
  <g transform="translate(60, 150)">
    <rect width="1080" height="135" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="135" rx="5" fill="#ef4444"/>
    
    <text x="35" y="45" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1">CRITICAL INCIDENT</text>
    <text x="35" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Degraded Availability for Actions, Pages &amp; Webhooks</text>
    <text x="35" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15">"We are investigating reports of degraded availability for Pages, Actions and Webhooks."</text>
  </g>

  <!-- 3 Service Status Cards -->
  <!-- Card 1: GitHub Actions -->
  <g transform="translate(60, 315)">
    <rect width="340" height="190" rx="18" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#ef4444" fill-opacity="0.2"/>
    <text x="37" y="52" fill="#ef4444" font-family="sans-serif" font-size="22" font-weight="bold">⚡</text>
    
    <text x="80" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">GitHub Actions</text>
    <text x="80" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">CI/CD &amp; Workflows</text>
    
    <rect x="25" y="90" width="145" height="30" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <text x="38" y="110" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">MAJOR OUTAGE</text>
    
    <text x="25" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">All runner workflows failing with</text>
    <text x="25" y="172" fill="#f87171" font-family="monospace" font-size="14" font-weight="bold">startup_failure</text>
  </g>

  <!-- Card 2: GitHub Pages -->
  <g transform="translate(430, 315)">
    <rect width="340" height="190" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="37" y="52" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold">🌐</text>
    
    <text x="80" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">GitHub Pages</text>
    <text x="80" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Web Hosting &amp; Deploy</text>
    
    <rect x="25" y="90" width="155" height="30" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="38" y="110" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">PARTIAL OUTAGE</text>
    
    <text x="25" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Deployments stuck in queue,</text>
    <text x="25" y="172" fill="#fcd34d" font-family="monospace" font-size="14" font-weight="bold">status: errored / building</text>
  </g>

  <!-- Card 3: Webhooks -->
  <g transform="translate(800, 315)">
    <rect width="340" height="190" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="37" y="52" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold">🔗</text>
    
    <text x="80" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">Webhooks</text>
    <text x="80" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Delivery &amp; Event Triggers</text>
    
    <rect x="25" y="90" width="175" height="30" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="38" y="110" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">DEGRADED PERFORM.</text>
    
    <text x="25" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Event delays across all repos,</text>
    <text x="25" y="172" fill="#fcd34d" font-family="monospace" font-size="14" font-weight="bold">events not triggering builds</text>
  </g>

  <!-- Footer Bar: PratikBase Signature & Tech Watch -->
  <g transform="translate(60, 545)">
    <rect width="1080" height="75" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- PratikBase Logo Icon -->
    <rect x="25" y="18" width="38" height="38" rx="10" fill="#3b82f6"/>
    <path d="M44 26 L36 38 L43 38 L42 48 L50 36 L43 36 Z" fill="#ffffff"/>
    
    <text x="75" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">PratikBase</text>
    <text x="175" y="42" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Live Web Platform &amp; Dev Watch</text>
    
    <text x="1055" y="43" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">pratikbase.com</text>
  </g>
</svg>
